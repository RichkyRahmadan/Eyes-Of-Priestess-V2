# ═══════════════════════════════════════════════════════════════════════════════
# Kong API Gateway — DB-less Declarative Configuration
# EyesOfPriestess: API Gateway Configuration
#
# Mode: DB-less (no database required for Kong itself)
# Format: Kong Declarative Config v3.0
#
# Routes Architecture:
#   :8080/api/v1/auth/*       → auth-service:8081
#   :8080/api/v1/wallet/*     → wallet-service:8082
#   :8080/api/v1/room/*       → room-service:8083
#   :8080/api/v1/chat/*       → chat-service:8084
#   :8080/api/v1/dispute/*    → dispute-service:8085
# ═══════════════════════════════════════════════════════════════════════════════
_format_version: "3.0"
_transform: true

# ─── SERVICES (Upstream Microservices) ─────────────────────────────────────────
services:

  # ── Auth Service ────────────────────────────────────────────────────────────
  - name: auth-service
    url: http://auth-service:8081
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      # Public auth routes — no JWT required
      - name: auth-public
        paths:
          - ~/api/v1/auth/(login|register|refresh|otp)
        strip_path: false
        methods: [GET, POST, OPTIONS]
        regex_priority: 10

      # Protected auth & profile routes
      - name: auth-protected
        paths:
          - /api/v1/auth
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]
        regex_priority: 0

    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:5173"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-Request-ID
          exposed_headers:
            - X-Request-ID
          credentials: true
          max_age: 86400

      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false

      - name: request-id
        config:
          generator: uuid#counter
          header_name: X-Request-ID
          echo_downstream: true

  # ── Wallet Service ────────────────────────────────────────────────────────────
  - name: wallet-service
    url: http://wallet-service:8082
    connect_timeout: 10000
    read_timeout: 60000    # Higher timeout for payment operations
    write_timeout: 60000
    routes:
      # Payment webhooks — no auth
      - name: wallet-webhook
        paths:
          - /api/v1/wallet/webhook
        strip_path: false
        methods: [POST, OPTIONS]
        regex_priority: 10

      # Wallet & payment routes
      - name: wallet-protected
        paths:
          - /api/v1/wallet
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]
        regex_priority: 0

    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:5173"
          methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
          headers:
            - Authorization
            - Content-Type
            - X-Request-ID
          credentials: true
          max_age: 86400

      - name: rate-limiting
        config:
          minute: 30     # Stricter for financial endpoints
          hour: 500
          policy: local
          fault_tolerant: true

      - name: request-id
        config:
          generator: uuid#counter
          header_name: X-Request-ID
          echo_downstream: true

  # ── Room Service ─────────────────────────────────────────────────────────────
  - name: room-service
    url: http://room-service:8083
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: room-routes
        paths:
          - /api/v1/room
        strip_path: false
        methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]

    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:5173"
          methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
          headers:
            - Authorization
            - Content-Type
            - X-Request-ID
          credentials: true
          max_age: 86400

      - name: rate-limiting
        config:
          minute: 60
          policy: local
          fault_tolerant: true

      - name: request-id
        config:
          generator: uuid#counter
          header_name: X-Request-ID
          echo_downstream: true

  # ── Chat Service (REST + WebSocket) ───────────────────────────────────────────
  - name: chat-service
    url: http://chat-service:8084
    connect_timeout: 10000
    read_timeout: 86400000   # 24h for WebSocket keep-alive
    write_timeout: 86400000
    routes:
      - name: chat-routes
        paths:
          - /api/v1/chat
        strip_path: false
        methods: [GET, POST, OPTIONS]
        protocols: [http, https, ws, wss]   # WebSocket support

    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:5173"
          methods: [GET, POST, OPTIONS]
          headers:
            - Authorization
            - Content-Type
            - Upgrade
            - Connection
          credentials: true
          max_age: 86400

      - name: rate-limiting
        config:
          minute: 100
          policy: local
          fault_tolerant: true

  # ── Dispute Service ───────────────────────────────────────────────────────────
  - name: dispute-service
    url: http://dispute-service:8085
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: dispute-routes
        paths:
          - /api/v1/dispute
        strip_path: false
        methods: [GET, POST, PUT, OPTIONS]

    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:3000"
            - "http://localhost:5173"
          methods: [GET, POST, PUT, OPTIONS]
          headers:
            - Authorization
            - Content-Type
            - X-Request-ID
          credentials: true
          max_age: 86400

      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true

      - name: request-id
        config:
          generator: uuid#counter
          header_name: X-Request-ID
          echo_downstream: true

# ─── GLOBAL PLUGINS ───────────────────────────────────────────────────────────
plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
