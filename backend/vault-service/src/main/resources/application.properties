# ═══════════════════════════════════════════════════════════════════════════════
# Vault Sanctum — Treasury & Payments
# application.properties — Xendit Only
# ═══════════════════════════════════════════════════════════════════════════════

quarkus.application.name=vault-service
quarkus.http.port=8082

# ─── The Archive (PostgreSQL — Reactive) ─────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/eyesofpriestess
quarkus.datasource.username=priestess
quarkus.datasource.password=originium_seal
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=vault

# ─── JWT (Seal Validation) ────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=eyesofpriestess

# ─── The Crystal (Redis — rate limiting, idempotency) ────────────────────────
quarkus.redis.hosts=redis://localhost:6379

# ─── The Aether (RabbitMQ) ───────────────────────────────────────────────────
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=priestess
rabbitmq-password=originium_seal

# Outgoing: offering accepted (xendit confirmed payment)
mp.messaging.outgoing.offering-accepted.connector=smallrye-rabbitmq
mp.messaging.outgoing.offering-accepted.exchange.name=eop.events
mp.messaging.outgoing.offering-accepted.routing-key=offering.accepted

# Incoming: covenant fulfilled → release escrow to counterpart
mp.messaging.incoming.covenant-fulfilled.connector=smallrye-rabbitmq
mp.messaging.incoming.covenant-fulfilled.exchange.name=eop.events
mp.messaging.incoming.covenant-fulfilled.binding-key=covenant.fulfilled
mp.messaging.incoming.covenant-fulfilled.queue.name=vault.covenant.fulfilled

# Incoming: judgment resolved → vault processes split/release/refund
mp.messaging.incoming.judgment-resolved.connector=smallrye-rabbitmq
mp.messaging.incoming.judgment-resolved.exchange.name=eop.events
mp.messaging.incoming.judgment-resolved.binding-key=judgment.resolved
mp.messaging.incoming.judgment-resolved.queue.name=vault.judgment.resolved

# ─── Downstream Services ─────────────────────────────────────────────────────
seal.service.url=http://localhost:8081
quarkus.rest-client.seal-service.url=${seal.service.url}

# ─── Xendit Payment Gateway (Sandbox) ────────────────────────────────────────
xendit.api.key=${XENDIT_API_KEY:xnd_development_REPLACE_ME}
xendit.webhook.token=${XENDIT_WEBHOOK_TOKEN:xnd_webhook_REPLACE_ME}
# Base callback URL (use ngrok for local development)
xendit.callback.url=${XENDIT_CALLBACK_URL:https://your-ngrok.ngrok.io}

quarkus.rest-client.xendit-api.url=https://api.xendit.co
quarkus.rest-client.xendit-api.connect-timeout=10000
quarkus.rest-client.xendit-api.read-timeout=30000

# ─── Tithe (Platform Fee) Configuration ──────────────────────────────────────
# Platform fee on escrow release (covenant fulfilled)
tithe.escrow.percentage=${TITHE_PERCENTAGE:1.0}
# Xendit disbursement fee pass-through on withdrawal (IDR)
tithe.withdrawal.flat=6500

# ─── Logging ─────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.eyesofpriestess".level=DEBUG

# ─── Health ──────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.enable=true

# ─── Dev Overrides ───────────────────────────────────────────────────────────
%dev.quarkus.log.level=DEBUG
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/eyesofpriestess
