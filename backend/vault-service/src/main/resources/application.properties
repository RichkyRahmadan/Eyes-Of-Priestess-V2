# ═══════════════════════════════════════════════════════════════════════════════
# Vault Sanctum — Treasury & Payments
# application.properties
# ═══════════════════════════════════════════════════════════════════════════════

quarkus.application.name=vault-service
quarkus.http.port=8082

# ─── The Archive (PostgreSQL — Reactive) ─────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/eyesofpriestess
quarkus.datasource.username=priestess
quarkus.datasource.password=originium_seal
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=vault

# ─── JWT (Seal Validation) ────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=eyesofpriestess

# ─── The Crystal (Redis) ─────────────────────────────────────────────────────
quarkus.redis.hosts=redis://localhost:6379

# ─── The Aether (RabbitMQ) ───────────────────────────────────────────────────
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=priestess
rabbitmq-password=originium_seal

# Incoming: offering accepted from payment gateway callback
mp.messaging.incoming.offering-accepted.connector=smallrye-rabbitmq
mp.messaging.incoming.offering-accepted.exchange.name=eop.events
mp.messaging.incoming.offering-accepted.binding-key=offering.accepted
mp.messaging.incoming.offering-accepted.queue.name=vault.offering.accepted

# Incoming: covenant fulfilled → release escrow
mp.messaging.incoming.covenant-fulfilled.connector=smallrye-rabbitmq
mp.messaging.incoming.covenant-fulfilled.exchange.name=eop.events
mp.messaging.incoming.covenant-fulfilled.binding-key=covenant.fulfilled
mp.messaging.incoming.covenant-fulfilled.queue.name=vault.covenant.fulfilled

# ─── Downstream Services ─────────────────────────────────────────────────────
seal.service.url=http://localhost:8081
quarkus.rest-client.seal-service.url=${seal.service.url}

# ─── Offering Channels (Payment Gateway — Sandbox) ────────────────────────────
midtrans.server.key=${MIDTRANS_SERVER_KEY:SB-Mid-server-sandbox}
midtrans.client.key=${MIDTRANS_CLIENT_KEY:SB-Mid-client-sandbox}
xendit.api.key=${XENDIT_API_KEY:xnd_development_sandbox}

# ─── Logging ─────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.eyesofpriestess".level=DEBUG

# ─── Health ──────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.enable=true

%dev.quarkus.log.level=DEBUG
