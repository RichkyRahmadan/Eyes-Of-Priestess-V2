# ═══════════════════════════════════════════════════════════════════════════════
# Seal Sanctum — Authentication & Identity
# application.properties
# ═══════════════════════════════════════════════════════════════════════════════

quarkus.application.name=auth-service
quarkus.http.port=8081

# ─── The Archive (PostgreSQL — Reactive) ─────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/eyesofpriestess
quarkus.datasource.username=priestess
quarkus.datasource.password=originium_seal
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=auth

# ─── JWT (Sacred Seal Generation) ─────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=eyesofpriestess
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem
quarkus.smallrye-jwt.enabled=true

# Seal expiry (seconds)
jwt.access.expiry=900
jwt.refresh.expiry=604800
jwt.issuer=eyesofpriestess

# ─── The Crystal (Redis — Sanction Seal blacklist) ────────────────────────────
quarkus.redis.hosts=redis://localhost:6379

# ─── The Aether (RabbitMQ) ───────────────────────────────────────────────────
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=priestess
rabbitmq-password=originium_seal

# Outgoing: User sanctioned event
mp.messaging.outgoing.User-sanctioned.connector=smallrye-rabbitmq
mp.messaging.outgoing.User-sanctioned.exchange.name=eop.events
mp.messaging.outgoing.User-sanctioned.routing-key=User.sanctioned

# ─── Logging ─────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.eyesofpriestess".level=DEBUG

# ─── Health ──────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.enable=true

# ─── Dev Config ──────────────────────────────────────────────────────────────
%dev.quarkus.log.level=DEBUG
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/eyesofpriestess
