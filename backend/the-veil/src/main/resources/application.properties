# ═══════════════════════════════════════════════════════════════════════════════
# The Veil — API Gateway
# application.properties
# ═══════════════════════════════════════════════════════════════════════════════

quarkus.application.name=the-veil
quarkus.http.port=8080

# ─── CORS ────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Covenant-Key,X-Requested-With
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# ─── JWT (Sacred Seal Validation) ─────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=eyesofpriestess
quarkus.smallrye-jwt.enabled=true

# ─── The Crystal (Redis — Sanction Seal blacklist) ────────────────────────────
quarkus.redis.hosts=redis://localhost:6379

# ─── Downstream Sanctum URLs ─────────────────────────────────────────────────
seal.service.url=http://localhost:8081
vault.service.url=http://localhost:8082
covenant.service.url=http://localhost:8083
communion.service.url=http://localhost:8084
judgment.service.url=http://localhost:8085

quarkus.rest-client.seal-service.url=${seal.service.url}
quarkus.rest-client.vault-service.url=${vault.service.url}
quarkus.rest-client.covenant-service.url=${covenant.service.url}
quarkus.rest-client.communion-service.url=${communion.service.url}
quarkus.rest-client.judgment-service.url=${judgment.service.url}

# ─── Logging ─────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.eyesofpriestess".level=DEBUG

# ─── Health ──────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.enable=true

# ─── Dev Mode ────────────────────────────────────────────────────────────────
%dev.quarkus.log.level=DEBUG
