# ═══════════════════════════════════════════════════════════════════════════════
# Judgment Sanctum — Dispute Resolution
# application.properties
# ═══════════════════════════════════════════════════════════════════════════════

quarkus.application.name=dispute-service
quarkus.http.port=8085

# ─── The Archive (PostgreSQL — Reactive) ─────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/eyesofpriestess
quarkus.datasource.username=priestess
quarkus.datasource.password=originium_seal
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=dispute

# ─── JWT (Seal Validation) ────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=eyesofpriestess

# ─── The Aether (RabbitMQ) ───────────────────────────────────────────────────
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=priestess
rabbitmq-password=originium_seal

# Incoming: Room broken → create judgment case
mp.messaging.incoming.Room-broken.connector=smallrye-rabbitmq
mp.messaging.incoming.Room-broken.exchange.name=eop.events
mp.messaging.incoming.Room-broken.binding-key=Room.broken
mp.messaging.incoming.Room-broken.queue.name=judgment.Room.broken

# Outgoing: judgment resolved → vault processes resolution
mp.messaging.outgoing.judgment-resolved.connector=smallrye-rabbitmq
mp.messaging.outgoing.judgment-resolved.exchange.name=eop.events
mp.messaging.outgoing.judgment-resolved.routing-key=judgment.resolved

# ─── Downstream Services ─────────────────────────────────────────────────────
vault.service.url=http://localhost:8082
seal.service.url=http://localhost:8081
quarkus.rest-client.wallet-service.url=${vault.service.url}
quarkus.rest-client.auth-service.url=${seal.service.url}

# ─── Logging ─────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.eyesofpriestess".level=DEBUG

# ─── Health ──────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.enable=true

%dev.quarkus.log.level=DEBUG
