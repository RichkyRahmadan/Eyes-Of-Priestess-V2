# ═══════════════════════════════════════════════════════════════════════════════
# Covenant Sanctum — Escrow Engine
# application.properties
# ═══════════════════════════════════════════════════════════════════════════════

quarkus.application.name=room-service
quarkus.http.port=8083

# ─── The Archive (PostgreSQL — Reactive) ─────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/eyesofpriestess
quarkus.datasource.username=priestess
quarkus.datasource.password=originium_seal
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=room

# ─── JWT (Seal Validation) ────────────────────────────────────────────────────
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=eyesofpriestess

# ─── The Crystal (Redis) ─────────────────────────────────────────────────────
quarkus.redis.hosts=redis://localhost:6379

# ─── The Aether (RabbitMQ) ───────────────────────────────────────────────────
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=priestess
rabbitmq-password=originium_seal

# Outgoing: covenant fulfilled → vault releases escrow
mp.messaging.outgoing.covenant-fulfilled.connector=smallrye-rabbitmq
mp.messaging.outgoing.covenant-fulfilled.exchange.name=eop.events
mp.messaging.outgoing.covenant-fulfilled.routing-key=covenant.fulfilled

# Outgoing: covenant broken → notify parties
mp.messaging.outgoing.covenant-broken.connector=smallrye-rabbitmq
mp.messaging.outgoing.covenant-broken.exchange.name=eop.events
mp.messaging.outgoing.covenant-broken.routing-key=covenant.broken

# ─── Downstream Services ─────────────────────────────────────────────────────
vault.service.url=http://localhost:8082
seal.service.url=http://localhost:8081
quarkus.rest-client.wallet-service.url=${vault.service.url}
quarkus.rest-client.auth-service.url=${seal.service.url}

# ─── Scheduler (Auto-release cron job) ───────────────────────────────────────
# Runs every hour to auto-release DELIVERED covenants past deadline
covenant.auto-release.cron=0 0 * * * ?

# ─── Logging ─────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.eyesofpriestess".level=DEBUG

# ─── Health ──────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.enable=true

%dev.quarkus.log.level=DEBUG
