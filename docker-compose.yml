# ═══════════════════════════════════════════════════════════════════════════════
# EyesOfPriestess — The Covenant Protocol
# Docker Compose: Full Sanctum Network Orchestration
# API Gateway: Kong (DB-less, declarative)
# Payment Gateway: Xendit
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── INFRASTRUCTURE ────────────────────────────────────────────────────────

  # The Archive (PostgreSQL 15)
  postgres:
    image: postgres:15-alpine
    container_name: eop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eyesofpriestess
      POSTGRES_USER: priestess
      POSTGRES_PASSWORD: originium_seal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priestess -d eyesofpriestess"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sanctum-network

  # The Crystal (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: eop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --save 60 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sanctum-network

  # The Aether (RabbitMQ 3 + Management UI)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: eop-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"    # Management UI: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: priestess
      RABBITMQ_DEFAULT_PASS: originium_seal
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sanctum-network

  # ─── FIVE SANCTUMS (BACKEND MICROSERVICES) ─────────────────────────────────

  # Seal Sanctum — Authentication & Identity (port 8081)
  seal-service:
    build:
      context: ./backend
      dockerfile: seal-service/Dockerfile
    container_name: eop-seal
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/eyesofpriestess
      QUARKUS_DATASOURCE_USERNAME: priestess
      QUARKUS_DATASOURCE_PASSWORD: originium_seal
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: priestess
      RABBITMQ_PASSWORD: originium_seal
      JWT_ISSUER: eyesofpriestess
      JWT_ACCESS_EXPIRY: 900
      JWT_REFRESH_EXPIRY: 604800
      QUARKUS_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanctum-network

  # Vault Sanctum — Treasury & Payments / Xendit (port 8082)
  vault-service:
    build:
      context: ./backend
      dockerfile: vault-service/Dockerfile
    container_name: eop-vault
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/eyesofpriestess
      QUARKUS_DATASOURCE_USERNAME: priestess
      QUARKUS_DATASOURCE_PASSWORD: originium_seal
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: priestess
      RABBITMQ_PASSWORD: originium_seal
      SEAL_SERVICE_URL: http://seal-service:8081
      XENDIT_API_KEY: ${XENDIT_API_KEY:-xnd_development_REPLACE_ME}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-xnd_webhook_REPLACE_ME}
      XENDIT_CALLBACK_URL: ${XENDIT_CALLBACK_URL:-https://your-ngrok.ngrok.io}
      TITHE_PERCENTAGE: 1.0
      QUARKUS_HTTP_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanctum-network

  # Covenant Sanctum — Escrow Room Engine (port 8083)
  covenant-service:
    build:
      context: ./backend
      dockerfile: covenant-service/Dockerfile
    container_name: eop-covenant
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/eyesofpriestess
      QUARKUS_DATASOURCE_USERNAME: priestess
      QUARKUS_DATASOURCE_PASSWORD: originium_seal
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: priestess
      RABBITMQ_PASSWORD: originium_seal
      SEAL_SERVICE_URL: http://seal-service:8081
      VAULT_SERVICE_URL: http://vault-service:8082
      QUARKUS_HTTP_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanctum-network

  # Communion Sanctum — Real-time Chat via WebSocket (port 8084)
  communion-service:
    build:
      context: ./backend
      dockerfile: communion-service/Dockerfile
    container_name: eop-communion
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/eyesofpriestess
      QUARKUS_DATASOURCE_USERNAME: priestess
      QUARKUS_DATASOURCE_PASSWORD: originium_seal
      SEAL_SERVICE_URL: http://seal-service:8081
      QUARKUS_HTTP_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sanctum-network

  # Judgment Sanctum — Dispute Resolution (port 8085)
  judgment-service:
    build:
      context: ./backend
      dockerfile: judgment-service/Dockerfile
    container_name: eop-judgment
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/eyesofpriestess
      QUARKUS_DATASOURCE_USERNAME: priestess
      QUARKUS_DATASOURCE_PASSWORD: originium_seal
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: priestess
      RABBITMQ_PASSWORD: originium_seal
      SEAL_SERVICE_URL: http://seal-service:8081
      VAULT_SERVICE_URL: http://vault-service:8082
      QUARKUS_HTTP_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - sanctum-network

  # ─── THE KONG GATEWAY ───────────────────────────────────────────────────────

  # Kong API Gateway — DB-less declarative mode (port 8080 proxy, 8001 admin)
  kong:
    image: kong:3.6-ubuntu
    container_name: eop-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yaml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
    volumes:
      - ./kong/kong.yaml:/opt/kong/kong.yaml:ro
    ports:
      - "8080:8000"    # Public Proxy — all client traffic goes here
      - "8443:8443"    # HTTPS Proxy (future TLS termination)
      - "8001:8001"    # Admin API (localhost only in production!)
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      - seal-service
      - vault-service
      - covenant-service
      - communion-service
      - judgment-service
    networks:
      - sanctum-network

  # ─── FRONTEND WEB APPLICATION ──────────────────────────────────────────────
  the-sanctum:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eop-sanctum-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
      - PUBLIC_WS_URL=ws://localhost:8080/ws/chat
    depends_on:
      - kong
    networks:
      - sanctum-network


# ─── NETWORKS ───────────────────────────────────────────────────────────────
networks:
  sanctum-network:
    driver: bridge
    name: eop-sanctum-network

# ─── VOLUMES ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: eop-postgres-data
  redis_data:
    name: eop-redis-data
  rabbitmq_data:
    name: eop-rabbitmq-data
